<!DOCTYPE html>
<html>
<body>
  <h1>Free-Fiesta UI</h1>
  <button onclick="trigger()">Run Task</button>
  <pre id="output"></pre>

  <script>
    function trigger() {
      fetch("http://localhost:8000/trigger-task")
        .then(res => res.json())
        .then(data => {
          document.getElementById("output").textContent = JSON.stringify(data, null, 2);
        });
    }
  </script>
</body>
</html>
