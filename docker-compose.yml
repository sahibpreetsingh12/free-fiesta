services:
  ollama:
    image: ollama/ollama:latest
    container_name: free_fiesta_ollama
    entrypoint: ["/bin/sh", "/app/startup/ollama-init.sh"]
    volumes:
      - ./startup:/app/startup
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: always

  worker:
    container_name: free_fiesta_worker
    build: ./worker
    shm_size: '1gb'
    ports:
      - "9000:9000"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - VLLM_URL=http://34.0.43.79:8001
      - PYTHONUNBUFFERED=1
    depends_on:
      - ollama
    volumes:
      - ./worker:/app           # /app/worker.py
    command: uvicorn worker:app --host 0.0.0.0 --port 9000 --timeout-keep-alive 0

  api:
    container_name: free_fiesta_api
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - worker
    volumes:
      - ./backend:/app          # /app/app.py exists here
      - ./tests:/app/tests      # 👈 Mounts tests so API container can see them
      - ./allure-results:/app/allure-results # 👈 Saves results here
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 0

  ui:
    container_name: free_fiesta_ui
    build: ./ui
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  ollama_data: