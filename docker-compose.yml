services:
  ollama:
    image: ollama/ollama:latest
    container_name: free_fiesta_ollama
    entrypoint: ["/bin/sh", "/app/startup/ollama-init.sh"]
    volumes:
      - ./startup:/app/startup
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: always

  worker:
    container_name: free_fiesta_worker
    build: ./worker
    shm_size: '10.24gb'
    ports:
      - "9000:9000"  # Ray Serve HTTP Port
      - "8265:8265"  # Ray Dashboard
    environment:
      - OLLAMA_URL=http://ollama:11434
      - VLLM_URL=http://34.0.43.79:8001
      - PYTHONUNBUFFERED=1
      # Tell Ray to listen on all interfaces for the Serve Proxy
      - RAY_SERVE_HTTP_HOST=0.0.0.0
      - RAY_SERVE_HTTP_PORT=9000
    depends_on:
      - ollama
    volumes:
      - ./worker:/app           
      - ~/.cache/huggingface:/root/.cache/huggingface
    
    # FIXED COMMAND:
    # 1. Removed invalid --http-host flags from 'ray start'
    # 2. Changed import path from 'worker.ray_app' to 'ray_app' (since /app is the root)
    command: >
      /bin/bash -c "
      ray start --head --dashboard-host=0.0.0.0 --port=6379 --dashboard-port=8265 --disable-usage-stats --block & 
      sleep 10 && 
      serve run --host 0.0.0.0 --port 9000 ray_app:ingress"
  api:
    container_name: free_fiesta_api
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - worker
    volumes:
      - ./backend:/app
      - ./tests:/app/tests
      - ./allure-results:/app/allure-results
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 0

  ui:
    container_name: free_fiesta_ui
    build: ./ui
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  ollama_data: