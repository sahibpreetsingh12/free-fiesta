services:
  ollama:
    image: ollama/ollama:latest
    container_name: free_fiesta_ollama
    entrypoint: ["/bin/sh", "/app/startup/ollama-init.sh"]
    volumes:
      - ./startup:/app/startup
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: always

  worker:
    container_name: free_fiesta_worker
    build: ./worker
    # 10.24gb is safe because you upgraded to 32GB RAM
    shm_size: '10.24gb'
    ports:
      - "9000:9000"  # Ray Serve HTTP Port
      - "8265:8265"  # Ray Dashboard
    environment:
      - OLLAMA_URL=http://ollama:11434
      # ✅ POINTS TO YOUR REMOTE GPU VM
      - VLLM_URL=http://34.0.43.79:8001
      - PYTHONUNBUFFERED=1
    depends_on:
      - ollama
    volumes:
      - ./worker:/app
      - ~/.cache/huggingface:/root/.cache/huggingface
    # ❌ REMOVED: GPU Reservation Block
    # Since this VM is the "Controller", it runs on CPU and sends requests
    # to your other VM (34.0.43.79) for the actual GPU work.
    
    command: >
      /bin/bash -c "
      # 1. Start Ray Cluster (Head Node)
      # --http-host=0.0.0.0 : Allows outside connections (like from your API container)
      # --http-port=9000    : The port where we send REST requests
      ray start --head \
        --dashboard-host=0.0.0.0 --port=6379 --dashboard-port=8265 \
        --http-host=0.0.0.0 --http-port=9000 \
        --disable-usage-stats --block & 
      
      # 2. Wait for Ray to wake up
      sleep 10 && 
      
      # 3. Deploy the App (No flags needed, it talks to the local Ray automatically)
      serve run worker.ray_app:ingress"

  api:
    container_name: free_fiesta_api
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - worker
    volumes:
      - ./backend:/app
      - ./tests:/app/tests
      - ./allure-results:/app/allure-results
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 0

  ui:
    container_name: free_fiesta_ui
    build: ./ui
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  ollama_data: