version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: free_fiesta_ollama
    entrypoint: ["/bin/sh", "/app/startup/ollama-init.sh"]
    volumes:
      - ./startup:/app/startup
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: always

  worker:
    container_name: free_fiesta_worker
    build: ./worker
    ports:
      - "9000:9000"
    environment:
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - ollama

  api:
    container_name: free_fiesta_api
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - worker

  ui:
    container_name: free_fiesta_ui
    build: ./ui
    ports:
      - "3000:3000"      # IMPORTANT FIX
    depends_on:
      - api

volumes:
  ollama_data:
