version: "3.9"

services:

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: always

  worker:
    build: ./worker
    ports:
      - "9000:9000"
    depends_on:
      - ollama
    environment:
      - OLLAMA_URL=http://ollama:11434

  api:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - worker

  ui:
    build: ./ui
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  ollama_data:

